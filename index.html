<script>
const BOOT_ART="images/BOOT_ART.jpg";
/* =========================================================
   金玉良缘 · 手机端
   界面重制：竖屏 · 舆图 · 章节 · 立绘剧情 · 养成 · 结局
   ========================================================= */
const SAVE_KEY='jyat_mobile_save_v1';
const ARCH_KEY='jyat_mobile_arch_v1';
const TAB_LABEL={map:'舆图',wardrobe:'衣橱',shop:'云锦阁',clues:'线索',npcs:'人物'};
let pickedId=null;let pickedGroom=null;
let currentTab='map';
let shopTab='jewel';
let toastTimer=null;
let lastSceneArt='';
let lastSceneWho='';
let lastSceneTitle='';
let lastSceneLoc='';
let settled=false;

const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const CN=['零','一','二','三','四','五','六','七','八','九','十'];
const IDX=['壹','贰','叁','肆','伍','陆'];

/* ---------- 基础规则 ---------- */
function idOf(){return IDENTITIES[S.id]}
function curCh(){return CHAPTERS[S.ch-1]}
function effAttr(k){
  let v=S.base[k]||0;
  const w=OUTFITS.find(o=>o.id===S.outfit);
  if(w&&w.eff&&w.eff[k])v+=w.eff[k];
  S.items.forEach(j=>{const g=JEWELS.find(x=>x.id===j);if(g&&g.eff&&g.eff[k])v+=g.eff[k]});
  return v;
}
const sgn=n=>(n>0?'+':'')+n;
const hasClue=c=>S.clues.indexOf(c)>=0;
function flagOf(name){return !!S.flags[name]||!!S.flags[S.id+':'+name]}
function setFlag(name,val){S.flags[S.id+':'+name]=val===undefined?true:val}
function dynTxt(obj){
  const k='story'+S.id.charAt(0).toUpperCase()+S.id.slice(1);
  return obj[k]||obj.story;
}
function dynEff(eff){
  const e={};
  for(const k in eff){
    const v=eff[k];
    if(k==='flag'&&typeof v==='object'&&!Array.isArray(v)){if(v[S.id])e.flag=v[S.id]}
    else if(k==='clue'&&typeof v==='object'&&!Array.isArray(v)){e.clue=v[S.id]||[]}
    else e[k]=v;
  }
  return e;
}
function defaultState(name,idKey){
  const d=IDENTITIES[idKey];
  return {name:name,id:idKey,ch:1,ap:5,used:[],money:d.money,
    base:{charm:d.bonus.charm||0,wit:d.bonus.wit||0,grace:d.bonus.grace||0,strat:d.bonus.strat||0},
    fav:{prince:0,hou:0,spy:0},clues:[],flags:{},items:[],outfit:'w0',wardrobe:['w0'],
    groom:null,ended:null,storyDone:{}};
}
function save(){if(S){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}}
function loadSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function loadArch(){try{return JSON.parse(localStorage.getItem(ARCH_KEY)||'{}')}catch(e){return{}}}
function saveArch(a){try{localStorage.setItem(ARCH_KEY,JSON.stringify(a))}catch(e){}}
function toast(msg){
  const t=el('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}
function effTxt(eff){
  if(!eff)return'';
  return ATTRS.filter(a=>eff[a[0]]).map(a=>a[1]+'+'+eff[a[0]]).join(' · ');
}
function applyEff(eff0){
  const eff=dynEff(eff0||{});const chips=[];
  ATTRS.forEach(a=>{const k=a[0];if(eff[k]){S.base[k]+=eff[k];chips.push({t:a[1]+' '+sgn(eff[k]),cls:eff[k]>0?'up':'down'})}});
  if(eff.money){S.money+=eff.money;chips.push({t:'银两 '+sgn(eff.money),cls:eff.money>0?'up':'down'})}
  if(eff.fav)for(const f in eff.fav){
    let v=eff.fav[f];
    if(v>0&&GROOMS.indexOf(f)>=0){
      const rel=relOf();
      v=Math.max(1,Math.round(v*(rel&&f===S.groom?rel.favMul:1)));
    }
    S.fav[f]+=v;
    chips.push({t:(NPCS[f]?NPCS[f].name:f)+' '+sgn(v),cls:v>0?'up':'down'});
  }
  let cl=eff.clue||[];
  if(typeof eff.clue==='string')cl=[eff.clue];
  if(eff.clueOnly)cl=[eff.clueOnly];
  cl.forEach(c=>{if(c&&CLUES[c]&&!S.clues.includes(c)){S.clues.push(c);chips.push({t:'线索 · '+CLUES[c].name,cls:'clue'})}});
  if(eff.flag){setFlag(eff.flag);chips.push({t:'命运转折',cls:'clue'})}
  if(eff.outfit){if(!S.wardrobe.includes(eff.outfit)){S.wardrobe.push(eff.outfit);const o=OUTFITS.find(x=>x.id===eff.outfit);if(o)chips.push({t:'新衣 · '+o.name,cls:'clue'})}}
  if(eff.item){if(!S.items.includes(eff.item))S.items.push(eff.item);const j=JEWELS.find(x=>x.id===eff.item);if(j)chips.push({t:'首饰 · '+j.name,cls:'clue'})}
  save();
  return chips;
}
function reqCheck(req){
  if(!req)return{ok:true};
  if(req.mode==='any'&&req.clue){if(req.clue.some(hasClue))return{ok:true};return{ok:false,msg:'需相关线索'}}
  if(req.clue){const cs=Array.isArray(req.clue)?req.clue:[req.clue];if(!cs.some(hasClue))return{ok:false,msg:'需线索 · '+cs.map(c=>CLUES[c]?CLUES[c].name:c).join(' / ')}}
  if(req.clueN&&S.clues.length<req.clueN)return{ok:false,msg:'需线索 ≥ '+req.clueN+' 条'}
  if(req.flag&&!flagOf(req.flag))return{ok:false,msg:'需先做出特定抉择'}
  if(req.any){for(const r of req.any){if(reqCheck(r).ok)return{ok:true}}return{ok:false,msg:'条件不足'}}
  if(req.fav)for(const f in req.fav){if((S.fav[f]||0)<req.fav[f])return{ok:false,msg:'需'+(NPCS[f]?NPCS[f].name:f)+'好感 ≥ '+req.fav[f]}}
  for(const k of ['charm','wit','grace','strat'])if(req[k]&&effAttr(k)<req[k])return{ok:false,msg:'需'+ATTRS.find(a=>a[0]===k)[1]+' ≥ '+req[k]}
  return{ok:true};
}
function reqHint(req){
  if(!req)return'';
  const parts=[];
  if(req.mode!=='any'&&req.clue){const cs=Array.isArray(req.clue)?req.clue:[req.clue];parts.push('线索 '+cs.map(c=>CLUES[c]?CLUES[c].name:c).join('/'))}
  if(req.clueN)parts.push('线索≥'+req.clueN);
  if(req.flag)parts.push('特定抉择');
  if(req.fav)for(const f in req.fav)parts.push((NPCS[f]?NPCS[f].name:f)+'好感≥'+req.fav[f]);
  for(const k of ['charm','wit','grace','strat'])if(req[k])parts.push(ATTRS.find(a=>a[0]===k)[1]+'≥'+req[k]);
  return parts.length?('需 '+parts.join(' · ')):'';
}

/* ---------- 开场 ---------- */
function setupBoot(){
  const has=!!loadSave();
  el('btnContinue').hidden=!has;
  el('minorDot').hidden=!has;
}
const SCREENS=['boot','create','matchmake','game','intro','scene','ending'];
function hideScreens(keep){
  SCREENS.forEach(k=>{if(k!==keep)el(k).hidden=true});
}
function toBoot(){
  closeSheet();
  hideScreens('boot');
  el('boot').hidden=false;
  setupBoot();
}
function goCreate(){
  closeSheet();
  hideScreens('create');
  pickedGroom=null;settled=false;
  el('create').hidden=false;
  renderCreate();
}
function nearestCard(){
  const rail=el('idRail');
  const rr=rail.getBoundingClientRect(),mid=rr.left+rr.width/2;
  let best=null,bd=1e9;
  rail.querySelectorAll('.cr-card').forEach(c=>{
    const b=c.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-mid);
    if(d<bd){bd=d;best=c}
  });
  return best;
}
function selectIdentity(id){
  if(!id||id===pickedId)return;
  pickedId=id;
  el('idRail').querySelectorAll('.cr-card').forEach(c=>c.classList.toggle('sel',c.getAttribute('data-id')===id));
  updateCreateName();
  renderDots();
}
function renderCreate(){
  if(!pickedId)pickedId='maid';
  const rail=el('idRail');
  rail.innerHTML=Object.keys(IDENTITIES).map((k,i)=>{
    const d=IDENTITIES[k];
    const bonus=ATTRS.filter(a=>d.bonus[a[0]]).map(a=>a[1]+'+'+d.bonus[a[0]]).join(' · ');
    return '<button class="cr-card'+(pickedId===k?' sel':'')+'" data-id="'+k+'">'+
      '<div class="cc-art art-'+k+'"><img src="'+ART[ID_ART[k]]+'" alt="" onerror="this.style.display=\'none\'"></div>'+
      '<span class="cc-idx">'+['壹','贰','叁'][i]+'</span>'+
      '<div class="cc-inner">'+
        '<h3>'+esc(d.name)+'</h3>'+
        '<div class="cc-tag">'+esc(d.tag)+'</div>'+
        '<p class="cc-desc">'+esc(d.desc)+'</p>'+
        '<div class="cc-perk">'+esc(d.perk)+'<br>初始 '+bonus+' · 银两 '+d.money+' 两</div>'+
      '</div></button>';
  }).join('');
  if(el('crDiff'))el('crDiff').innerHTML=esc(IDENTITIES[pickedId].diff.split(' · ')[0])+'局';
  rail.querySelectorAll('.cr-card').forEach(card=>{
    card.addEventListener('click',()=>{
      if(Date.now()-(rail._moved||0)<300)return;
      selectIdentity(card.getAttribute('data-id'));
      card.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    });
  });
  if(!rail._bound){
    rail._bound=true;
    rail.addEventListener('scroll',()=>{
      rail._moved=Date.now();
      clearTimeout(rail._selT);
      rail._selT=setTimeout(()=>{
        const c=nearestCard();
        if(c)selectIdentity(c.getAttribute('data-id'));
      },120);
    },{passive:true});
  }
  requestAnimationFrame(()=>{
    const c=rail.querySelector('.cr-card.sel');
    if(!c)return;
    const rr=rail.getBoundingClientRect(),cr=c.getBoundingClientRect();
    rail.scrollLeft+=(cr.left+cr.width/2)-(rr.left+rr.width/2);
  });
  renderDots();
  updateCreateName();
}
function renderDots(){
  const keys=Object.keys(IDENTITIES);
  el('idDots').innerHTML=keys.map(k=>'<i class="'+(k===pickedId?'on':'')+'"></i>').join('');
}
function updateCreateName(){
  if(!el('crName')||!pickedId)return;
  const typed=(el('nameInput').value||'').trim();
  el('crName').textContent=typed||IDENTITIES[pickedId].defaultName;
  if(el('crDiff'))el('crDiff').innerHTML=esc(IDENTITIES[pickedId].diff.split(' · ')[0])+'局';
}
function startNew(){
  if(!pickedGroom){toast('先定一门亲事');return}
  const d=IDENTITIES[pickedId];
  const typed=(el('nameInput').value||'').trim();
  S=defaultState(typed||d.defaultName,pickedId);
  S.groom=pickedGroom;
  const r=REL[pickedGroom][pickedId];
  S.fav[pickedGroom]+=r.favStart;
  if(r.bias)for(const k in r.bias)S.base[k]=(S.base[k]||0)+r.bias[k];
  currentTab='map';shopTab='jewel';
  save();
  el('create').hidden=true;el('matchmake').hidden=true;
  chapterIntro();
}
/* ---------- 择婿 ---------- */
function goMatch(){
  hideScreens('matchmake');
  el('matchmake').hidden=false;
  pickedGroom=null;
  el('mmNote').textContent='以「'+IDENTITIES[pickedId].name+'」的身份入京——你会遇见这样三个人。';
  renderMatch();
}
function backToCreate(){
  el('matchmake').hidden=true;el('create').hidden=false;
}
function renderMatch(){
  const list=el('mmList');
  const keep=list.scrollTop;
  list.innerHTML=GROOMS.map(g=>{
    const n=NPCS[g];
    const art=(ART[g]||fallbackArt());
    return '<button class="mm-card'+(pickedGroom===g?' sel':'')+'" data-g="'+g+'">'+
      '<div class="mm-art'+(ART_CLS[g]?' art-'+g:'')+'"><img src="'+art+'" alt="" onerror="this.style.display=\'none\'"><i class="mm-fade"></i></div>'+
      '<div class="mm-body"><h3>'+esc(n.name)+'</h3><div class="mm-ttl">'+esc(n.title)+'</div>'+
        '<div class="mm-quote">'+esc(n.quote)+'</div>'+
        '<div class="mm-line">'+esc(n.desc)+'</div>'+
      '</div></button>';
  }).join('');
  list.querySelectorAll('.mm-card').forEach(c=>{
    c.onclick=()=>{pickedGroom=c.getAttribute('data-g');renderMatch();};
  });
  list.scrollTop=keep;
  requestAnimationFrame(sizeMatchArt);
  const b=el('btnGroom');
  b.disabled=!pickedGroom;
  b.textContent=pickedGroom?('与 '+NPCS[pickedGroom].name+' 定 亲'):'先 选 一 个 人';
}
function sizeMatchArt(){
  if(!el('mmList'))return;
  el('mmList').querySelectorAll('.mm-card').forEach(c=>{
    const art=c.querySelector('.mm-art');
    if(!art)return;
    art.style.height='';
    const h=c.clientHeight;
    if(h>0)art.style.height=h+'px';
  });
}
window.addEventListener('resize',()=>{const m=el('matchmake');if(m&&!m.hidden)sizeMatchArt()});
function relOf(){
  return (S&&S.groom&&REL[S.groom]&&REL[S.groom][S.id])||null;
}
function continueGame(){
  const s=loadSave();
  if(!s){toast('尚无前缘可续');return}
  S=s;
  if(!('groom' in S)){
    const bk=['prince','hou','spy'].sort((a,b)=>(S.fav[b]||0)-(S.fav[a]||0))[0];
    S.groom=(S.fav&&(S.fav[bk]||0)>0)?bk:null;
  }
  if(S.ended){renderEnding(S.ended);return}
  el('boot').hidden=true;
  showGame();
  toast('续 · 前 缘');
}

/* ---------- 章节与主界面 ---------- */
function showGame(){
  hideScreens('game');
  el('game').hidden=false;
  renderTop();
  renderTab();
}
function chapterIntro(){
  const ch=curCh();
  const title=(ch.name.split('·')[1]||ch.name).trim();
  let paras=(ch.intro&&ch.intro[S.id])||[];
  const rel=relOf();
  if(rel&&rel.beats&&rel.beats[ch.n-1])paras=paras.concat([{beat:rel.beats[ch.n-1]}]);
  hideScreens('intro');
  el('intro').innerHTML=
    '<div class="intro-inner">'+
      '<div class="intro-no">'+(ch.n<10?'0':'')+ch.n+'</div>'+
      '<div class="intro-kicker">第'+CN[ch.n]+'章 · 上 京</div>'+
      '<h2>'+esc(title)+'</h2>'+
      '<span class="in-month">'+esc(ch.month)+'</span>'+
      '<div class="in-hint">'+esc(ch.hint)+'</div>'+
      '<div class="intro-body">'+paras.map(p=>typeof p==='string'?'<p>'+esc(p)+'</p>':'<p class="in-beat">'+esc(p.beat)+'</p>').join('')+'</div>'+
      '<button class="btn-main" id="btnEnterCh">落 · '+esc(title)+'</button>'+
    '</div>';
  el('intro').hidden=false;
  el('btnEnterCh').onclick=()=>{
    el('intro').hidden=true;
    currentTab='map';
    showGame();
  };
}
function renderTop(){
  if(!S)return;
  const d=idOf();
  const av={src:ART[ID_ART[S.id]]||ART.qingwu,cls:'id-face'};
  const img=el('tbAvatar');
  let _ai=img.querySelector('img');
  if(!_ai){img.innerHTML='<img src="'+av.src+'" alt="">';_ai=img.querySelector('img');}
  else if(_ai.getAttribute('src')!==av.src){_ai.setAttribute('data-fb','');_ai.src=av.src;}
  img.className=av.cls;
  el('tbName').textContent=S.name;
  el('tbId').textContent=d.name+' · '+d.home;
  el('tbCh').textContent=curCh().name;
  el('tbMoney').textContent=S.money;
  let dots='';
  for(let i=0;i<5;i++)dots+='<i class="'+(i<S.ap?'on':'')+'"></i>';
  el('apDots').innerHTML=dots;
  el('tbAttrs').innerHTML=ATTRS.map(a=>
    '<div class="attr"><span>'+a[1]+'</span><b>'+effAttr(a[0])+'</b></div>'
  ).join('');
}
function renderTab(){
  if(!S)return;
  el('main').classList.remove('tab-map');
  renderTop();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.getAttribute('data-tab')===currentTab));
  if(currentTab==='map')renderMapTab();
  else if(currentTab==='wardrobe')renderWardrobeTab();
  else if(currentTab==='shop')renderShopTab();
  else if(currentTab==='clues')renderCluesTab();
  else renderNpcsTab();
  updateFab();
  if(el('main').scrollTop===0){
    el('main').animate([{opacity:.55},{opacity:1}],{duration:260,easing:'ease-out'});
  }
}
let fabObs=null;
function updateFab(){
  const fab=el('fabClimax');
  if(!fab)return;
  if(fabObs){fabObs.disconnect();fabObs=null}
  if(!S||currentTab!=='map'||!climaxOpen()){fab.hidden=true;return}
  el('fabName').textContent=curCh().climax.name;
  const target=document.querySelector('.climax-btn');
  if(!target){fab.hidden=false;return}
  fab.hidden=false;
  fabObs=new IntersectionObserver(es=>{
    fab.hidden=es[0].isIntersecting||!climaxOpen();
  },{root:el('main'),threshold:.25});
  fabObs.observe(target);
}
function chapterCardHTML(){
  const ch=curCh();
  const t=(ch.name.split('·')[1]||ch.name).trim();
  return '<div class="ch-card">'+
    '<div class="ch-n">第'+CN[S.ch]+'章 · '+(S.ch<10?'0':'')+S.ch+' / 0'+CHAPTERS.length+'</div>'+
    '<h2>'+esc(t)+'</h2>'+
    '<div class="ch-month">'+esc(ch.month)+' · 上京</div>'+
    (S.groom?'<div class="ch-route">婚约 · '+esc(NPCS[S.groom].name)+'</div>':'')+
    '<div class="ch-hint">'+esc(ch.hint)+'</div>'+
    '<div class="ch-seal">'+CN[S.ch]+'<br>章</div>'+
  '</div>';

  else if(!S.groom&&flagOf('end_prince')&&S.fav.prince>=26&&effAttr('strat')>=12)end='e_fengguan';
  else if(!S.groom&&flagOf('end_hou')&&S.fav.hou>=24&&hasClue('c2'))end='e_kuaima';
  else if(!S.groom&&flagOf('end_spy')&&S.fav.spy>=26&&hasClue('c3'))end='e_shanhe';

  else if(S.id==='miss'&&flagOf('family_saved'))end='e_jinzhi';
  else if(S.id==='gen'&&flagOf('army_saved'))end='e_jiangmen';
  else if(maxFav<22&&effAttr('strat')>=12)end='e_fengyue';
  else if(flagOf('lost')&&maxFav<24)end='e_chaliang';
  else if(!S.groom&&S.fav.prince>=26&&effAttr('strat')>=12)end='e_fengguan';
  else if(!S.groom&&S.fav.hou>=24&&hasClue('c2'))end='e_kuaima';
  else if(!S.groom&&S.fav.spy>=26&&hasClue('c3'))end='e_shanhe';
  else if(!S.groom&&flagOf('end_prince'))end='e_fengguan';
  else if(!S.groom&&flagOf('end_hou'))end='e_kuaima';
  else if(!S.groom&&flagOf('end_spy'))end='e_shanhe';

  const arch=loadArch();arch[end]=true;saveArch(arch);

/* ---------- 衣橱 / 商铺 / 线索 / 人物 ---------- */
function pageHead(title,sub){
  return '<div class="sh-head" style="padding-top:4px"><div><h3>'+title+'</h3><p>'+sub+'</p></div></div>';
}
function renderWardrobeTab(){
  let html=pageHead('衣 橱 · 妆 台','衣裳改变立绘与属性 · 首饰加成另计');
  html+='<div class="ward-grid">';
  OUTFITS.forEach(w=>{
    if(w.minCh&&S.ch<w.minCh&&!S.wardrobe.includes(w.id))return;
    const owned=S.wardrobe.includes(w.id);
    const on=S.outfit===w.id;
    const a=outfitArt(w.id);
    html+='<div class="ward'+(on?' on':'')+'">'+
      '<img src="'+a.src+'" class="'+(a.cls||'')+'" alt="">'+
      '<div class="w-body"><h5>'+esc(w.name)+(on?'<span class="badge">在穿</span>':'')+'</h5>'+
      '<p>'+esc(w.desc)+'</p><div class="w-eff">'+(effTxt(w.eff)||'—')+'</div>'+
      (owned?'<button class="w-btn" '+(on?'disabled':'onclick="wearOutfit(\''+w.id+'\')"')+'>'+(on?'穿 着 中':'换 上')+'</button>':'<div class="w-lock">云锦阁可得 · '+w.price+' 两</div>')+
      '</div></div>';
  });
  html+='</div>';
  el('main').innerHTML=html;
}
function wearOutfit(id){
  S.outfit=id;save();renderTop();
  const y=el('main').scrollTop;renderWardrobeTab();el('main').scrollTop=y;
  toast('换上「'+OUTFITS.find(o=>o.id===id).name+'」');
}
function jewelIcon(id){
  return '<img class="jewel-img" src="'+(ART[id]||fallbackArt())+'" alt="">';
}
function renderShopTab(){
  const disc=S.id==='miss'?0.8:1;
  let html=pageHead('云 锦 阁','银两 '+S.money+' 两'+(S.id==='miss'?' · 伯府千金享八成':''));
  html+='<div class="seg"><button class="'+(shopTab==='jewel'?'on':'')+'" onclick="shopTab=\'jewel\';renderTab()">首 饰</button>'+
    '<button class="'+(shopTab==='robe'?'on':'')+'" onclick="shopTab=\'robe\';renderTab()">衣 裳</button></div>';
  let rows='';
  if(shopTab==='jewel'){
    JEWELS.forEach(j=>{
      if(j.minCh&&S.ch<j.minCh)return;
      const owned=!j.repeat&&S.items.includes(j.id);
      const price=Math.round(j.price*disc);
      rows+='<div class="goods-row">'+
        '<div class="goods-ico">'+jewelIcon(j.id)+'</div>'+
        '<div class="goods-info"><h5>'+esc(j.name)+'</h5><p>'+esc(j.desc)+'</p><div class="eff">'+effTxt(j.eff)+'</div></div>'+
        '<button class="buy-btn'+(owned?' own':'')+'" onclick="'+(owned?'':'buyItem(\''+j.id+'\')')+'">'+price+' 两<small>'+(owned?'已购入':'购 买')+'</small></button>'+
      '</div>';
    });
  }else{
    OUTFITS.forEach(w=>{
      if(!w.price)return;
      if(w.minCh&&S.ch<w.minCh&&!S.wardrobe.includes(w.id))return;
      const owned=S.wardrobe.includes(w.id);
      const price=Math.round(w.price*disc);
      const a=outfitArt(w.id);
      rows+='<div class="goods-row">'+
        '<img class="goods-thumb '+(a.cls||'')+'" src="'+a.src+'" alt="">'+
        '<div class="goods-info"><h5>'+esc(w.name)+'</h5><p>'+esc(w.desc)+'</p><div class="eff">'+effTxt(w.eff)+'</div></div>'+
        '<button class="buy-btn'+(owned?' own':'')+'" onclick="'+(owned?'':'buyOutfit(\''+w.id+'\')')+'">'+price+' 两<small>'+(owned?'已入衣橱':'购 买')+'</small></button>'+
      '</div>';
    });
  }
  html+='<div class="goods-list">'+rows+'</div>';
  el('main').innerHTML=html;
}
function buyItem(jid){
  const j=JEWELS.find(x=>x.id===jid);if(!j)return;
  const disc=S.id==='miss'?0.8:1;const price=Math.round(j.price*disc);
  if(S.money<price){toast('银两不足');return}
  S.money-=price;
  if(j.repeat){
    for(const k in j.eff)S.base[k]=(S.base[k]||0)+j.eff[k];
    S.items.push(jid);
    S.items=S.items.filter((v,i)=>S.items.indexOf(v)===i);
  }else{
    if(!S.items.includes(jid))S.items.push(jid);
  }
  save();renderTop();
  const y=el('main').scrollTop;renderShopTab();el('main').scrollTop=y;
  toast('购得「'+j.name+'」');
}
function buyOutfit(wid){
  const w=OUTFITS.find(x=>x.id===wid);if(!w)return;
  const disc=S.id==='miss'?0.8:1;const price=Math.round(w.price*disc);
  if(S.money<price){toast('银两不足');return}
  S.money-=price;
  if(!S.wardrobe.includes(wid))S.wardrobe.push(wid);
  S.outfit=wid;
  save();renderTop();
  const y=el('main').scrollTop;renderShopTab();el('main').scrollTop=y;
  toast('换上新衣「'+w.name+'」');
}
function renderCluesTab(){
  let html=pageHead('线 索 册','已集 '+S.clues.length+' / '+Object.keys(CLUES).length+' 条 · 同一局，三种真相');
  html+='<div class="progress"><i style="width:'+(S.clues.length/Object.keys(CLUES).length*100)+'%"></i></div>';
  if(!S.clues.length){
    html+='<div class="empty">尚未得到任何线索。<br>多与人交谈，多走暗巷。</div>';
  }else{
    S.clues.forEach(c=>{
      const d=CLUES[c];if(!d)return;
      html+='<div class="clue-item"><span class="cat">'+esc(d.cat)+'</span><h5>◈ '+esc(d.name)+'</h5><p>'+esc(d.text)+'</p></div>';
    });
  }
  el('main').innerHTML=html;
}
function renderNpcsTab(){
  const rel=relOf();
  const order=S.groom?[S.groom].concat(['prince','hou','spy'].filter(k=>k!==S.groom)):['prince','hou','spy'];
  let html=pageHead('人 物 · 棋 子',S.groom?'婚约已定，其余人便是局中子':'好感最高的人，不一定是活到最后的人');
  let rows='';
  order.concat(['rival']).forEach(k=>{
    const n=NPCS[k];const fv=S.fav[k]||0;const isG=(k===S.groom);
    rows+='<div class="npc'+(isG?' groom':'')+'" onclick="openArt(\''+k+'\')"><img src="'+ART[k]+'" alt=""><div class="npc-info">'+
      '<h4>'+esc(n.name)+(isG?'<span class="mm-badge">婚约</span>':'')+'</h4><div class="ttl">'+esc(n.title)+'</div>'+
      '<div class="quote">'+esc(isG&&rel?rel.line:n.quote)+'</div>'+
      (!isG&&rel&&rel.others&&rel.others[k]?'<div class="npc-tie">'+esc(rel.others[k])+'</div>':'')+
      (k==='rival'?'<div class="fav"><span>敌 意</span><div class="bar"><i style="width:82%;background:linear-gradient(90deg,#6b2a22,#c25a47)"></i></div><b style="color:#cf7b67">高</b></div>':
        '<div class="fav"><span>好 感</span><div class="bar"><i style="width:'+Math.min(100,fv*2.5)+'%"></i></div><b>'+fv+'</b></div>')+
    '</div></div>';
  });
  (ID_NPCS[S.id]||[]).forEach(k=>{
    const n=NPCS[k];
    rows+='<div class="npc" onclick="openArt(\''+k+'\')"><img src="'+ART[k]+'" alt=""><div class="npc-info">'+
      '<h4>'+esc(n.name)+'</h4><div class="ttl">'+esc(n.title)+'</div>'+
      '<div class="quote">'+esc(n.quote)+'</div><div class="fav"><span>若你未选此线</span></div>'+
    '</div></div>';
  });
  html+='<div class="npc-list">'+rows+'</div>';
  el('main').innerHTML=html;
}

/* ---------- 弹层 ---------- */
function sheetHead(title,sub){
  return '<div class="sh-head"><div><h3>'+title+'</h3><p>'+sub+'</p></div><button class="sh-close" onclick="closeSheet()">✕</button></div>';

function openArt(k){

function openSheet(html){

}

/* ---------- 存档导入导出 ---------- */
function packSave(){
  return JSON.stringify({v:1,at:new Date().toISOString(),save:S,arch:loadArch()},null,2);
}
function exportFile(){
  if(!S)return;
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const fn='金玉良缘_存档_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.json';
  const url=URL.createObjectURL(new Blob([packSave()],{type:'application/json'}));
  const a=document.createElement('a');
  a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('已导出 '+fn);
}
function openImport(){
  openSheet(sheetHead('导 入 存 档','选择导出的 .json 存档文件')+
    '<div class="io-wrap"><label class="io-file"><input type="file" id="ioFile" accept="application/json,.json" onchange="readSaveFile(this)"><span>选 择 存 档 文 件</span></label>'+
    '<div class="menu-tip">导入将覆盖本机现有进度与结局图鉴</div></div>');
}
function readSaveFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(f.size>512*1024){toast('文件过大');return}
  const r=new FileReader();
  r.onload=()=>applyImport(String(r.result||''));
  r.onerror=()=>toast('读取失败');
  r.readAsText(f);
}
function applyImport(txt){
  let data=null;
  try{data=JSON.parse(txt)}catch(e){}
  const sv=data&&data.save;
  if(!sv||!sv.name||!IDENTITIES[sv.id]||typeof sv.ch!=='number'||!CHAPTERS[sv.ch-1]){toast('存档文件无效');return}
  S=Object.assign(defaultState(sv.name,sv.id),sv);
  save();
  if(data.arch&&typeof data.arch==='object')saveArch(data.arch);
  closeSheet();showGame();renderTop();renderTab();toast('已导入存档');
}
function openMenu(){
  if(!S)return;
  openSheet(sheetHead('菜 单','第'+CN[S.ch]+'章 · '+curCh().name.split('·')[1].trim()+' · 行动力 '+S.ap)+
    '<div class="menu-list">'+
      '<button onclick="save();closeSheet();toast(\'已存档\')">存 档</button>'+
      '<button onclick="exportFile()">导 出 存 档</button>'+
      '<button onclick="openImport()">导 入 存 档</button>'+
      '<button onclick="openGallery()">结 局 图 鉴</button>'+
      '<button onclick="toBoot()">回 · 开 场</button>'+
      '<button class="danger" onclick="confirmRestart()">重 新 开 局</button>'+
    '</div>'+
    '<div class="menu-tip">'+esc(idOf().perk)+'<br>进度自动保存于本机</div>');
}
function confirmRestart(){
  openSheet(sheetHead('重 新 开 局','当前进度将被清除，此决定不可撤销')+
    '<div class="menu-list"><button class="danger" onclick="clearSave();S=null;closeSheet();goCreate()">确 定 · 重 开</button>'+
    '<button onclick="closeSheet()">再 想 想</button></div>');
}
function openGallery(){
  const arch=loadArch();

  html+='<div class="gal-grid">';

  });
  html+='</div>';
  openSheet(html);

/* ---------- 浮尘 ---------- */
(function motes(){
  const c=el('motes');
  if(!c)return;
  const ctx=c.getContext('2d');
  let W=0,H=0,ps=[],raf=0;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    const r=c.parentElement.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width;H=r.height;
    c.width=W*dpr;c.height=H*dpr;
    c.style.width=W+'px';c.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ps=[];
    const n=reduce?10:26;
    for(let i=0;i<n;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.5,vy:-(.05+Math.random()*.18),vx:(Math.random()-.5)*.06,a:.08+Math.random()*.35,p:Math.random()*6.283});
  }
  function tick(t){
    if(el('boot').hidden){raf=requestAnimationFrame(tick);return}
    ctx.clearRect(0,0,W,H);
    ps.forEach((p,i)=>{
      p.y+=p.vy;p.x+=p.vx;
      if(p.y<-8){p.y=H+8;p.x=Math.random()*W}
      if(p.x<-8)p.x=W+8;if(p.x>W+8)p.x=-8;
      const a=p.a*(.55+.45*Math.sin(t/1400+p.p));
      ctx.beginPath();
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.2);
      g.addColorStop(0,'rgba(226,200,148,'+a+')');
      g.addColorStop(1,'rgba(226,200,148,0)');
      ctx.fillStyle=g;ctx.arc(p.x,p.y,p.r*3.2,0,6.283);ctx.fill();
    });
    raf=requestAnimationFrame(tick);
  }
  resize();
  window.addEventListener('resize',resize);
  raf=requestAnimationFrame(tick);
})();

function init(){
  setupBoot();
  el('btnStart').onclick=goCreate;
  el('btnBackBoot').onclick=toBoot;
  el('btnNew').onclick=goMatch;
  el('btnBackCreate').onclick=backToCreate;
  el('btnGroom').onclick=startNew;
  el('btnContinue').onclick=continueGame;
  el('btnGallery').onclick=openGallery;
  el('btnMenu').onclick=openMenu;
  el('sheetMask').onclick=closeSheet;
  el('nameInput').addEventListener('input',updateCreateName);
  el('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')goCreate()});
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      const tab=t.getAttribute('data-tab');
      if(tab===currentTab){el('main').scrollTop=0;return}
      currentTab=tab;
      renderTab();
      el('main').scrollTop=0;
    });
  });
}
init();
